name: Build Android APK & AAB (Capacitor)

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  android-build:
    name: Compile Web Bundle & Package Android APK + AAB
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java JDK 21 (Required by Capacitor 8 & Android Gradle Plugin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Type-check & Build Web Bundle
        run: |
          npm run lint
          npm run build

      - name: Initialize & Sync Capacitor Android Platform
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi
          npx cap sync android

      - name: Build Debug APK & Release AAB Bundle
        working-directory: ./android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug bundleRelease --no-daemon

      - name: Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: omnimini-android-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn

      - name: Upload Android Play Store AAB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: omnimini-android-release-aab
          path: android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: warn
