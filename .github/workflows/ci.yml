name: CI Quality & Security Gate

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: TypeScript strict check
        run: npm run lint

      - name: Audit Firestore Security Rules
        run: npx eslint firestore.rules

      - name: Verify production bundle build
        run: npm run build
