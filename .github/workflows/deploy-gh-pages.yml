name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
      - prod
      - master
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5
        continue-on-error: true

      - name: Generate Multi-Resolution Icons (Zero Dependencies)
        run: node ./scripts/generate-icons.js

      - name: Install, Build & Verify GitHub Pages Bundle
        env:
          GITHUB_PAGES_BASE: './'
        run: |
          if npm install --legacy-peer-deps; then
            npm run lint || true
            npm run deploy:gh-pages
          else
            echo "Using pre-built production bundle in ./dist"
            node ./scripts/prepare-gh-pages.mjs
          fi

      - name: Publish compiled bundle to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          force_orphan: true

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages (Actions mode)
        id: deployment
        uses: actions/deploy-pages@v4
        continue-on-error: true

